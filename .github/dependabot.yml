# Revisa dependencias una vez por semana y abre PR agrupados.
# Cada PR de Dependabot pasa por el CI como cualquier otro.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      firebase:
        patterns: ["firebase*", "cloud_firestore*", "flutterfire*"]
      generadores:
        patterns: ["build_runner", "freezed*", "json_*", "riverpod_generator", "riverpod_lint", "custom_lint"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
