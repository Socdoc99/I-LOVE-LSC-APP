# Verificación automática de cada push a main y de cada pull request,
# incluidos los que abre Claude. Es el check obligatorio para fusionar a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Mientras no exista el proyecto Flutter, el job pasa sin hacer nada,
      # para que la protección de main no bloquee los PR de configuración.
      - name: Detectar proyecto Flutter
        id: proyecto
        run: |
          if [ -f pubspec.yaml ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; echo "Sin pubspec.yaml: nada que verificar todavía."; fi

      - uses: subosito/flutter-action@v2
        if: steps.proyecto.outputs.existe == 'true'
        with:
          channel: stable
          cache: true

      - name: Dependencias
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter pub get

      - name: Generar código (freezed, riverpod, json)
        if: steps.proyecto.outputs.existe == 'true'
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Formato
        if: steps.proyecto.outputs.existe == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter analyze

      - name: Pruebas con cobertura
        if: steps.proyecto.outputs.existe == 'true'
        run: flutter test --coverage

      - name: Guardar cobertura
        if: steps.proyecto.outputs.existe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
