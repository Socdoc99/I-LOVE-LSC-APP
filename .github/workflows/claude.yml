# Claude trabaja en GitHub mientras tú estás en otra cosa.
# Uso: en un issue o PR, comenta "@claude implementa este issue siguiendo CLAUDE.md".
# Claude crea una rama, programa, corre flutter analyze/test y abre un pull request.
# Solo responde a comentarios del dueño del repositorio.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Una sola ejecución a la vez para no generar ramas que choquen entre sí.
    concurrency:
      group: claude-agent
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flutter instalado en el runner para que Claude pueda compilar y probar.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias (si el proyecto ya existe)
        run: |
          if [ -f pubspec.yaml ]; then flutter pub get; fi

      - uses: anthropics/claude-code-action@v1
        with:
          # Token de tu suscripción de Claude: se crea con /install-github-app
          # y queda guardado como secreto CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(flutter:*),Bash(dart:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
